[project]
name = "project-ai-internship-application-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "chromadb>=1.5.9",
    "email-validator>=2.3.0",
    "fastapi>=0.140.0",
    "greenlet>=3.5.4",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "pypdf>=6.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/scraper/mocker_scraper.py" = ["E501"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
